name: adb_files
description: A desktop file manager for Android devices.
publish_to: none
# The build number is a placeholder for local runs: tool/release.sh overrides
# it with the git commit count, so released builds number themselves.
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  adb_core:
    git:
      url: https://github.com/developer180527/adb_dart.git
      path: packages/adb_core
      ref: v0.3.1
  adb_ui:
    git:
      url: https://github.com/developer180527/adb_dart.git
      path: packages/adb_ui
      ref: v0.3.1
  feature_files:
    path: ../../packages/feature_files
  feature_stats:
    path: ../../packages/feature_stats
  flutter:
    sdk: flutter
  # Both directions plus lazy virtual files, so dragging a device file
  # out to Finder can download on drop instead of pre-fetching.
  super_drag_and_drop: ^0.8.0
  # Native save/choose-folder panels (flutter/packages, first-party).
  file_selector: ^1.0.3
  # Real audio/video playback on every desktop platform (libmpv).
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # PDFium-backed PDF rendering.
  pdfrx: ^2.0.0
  # Reads the running bundle's version, so the About box cannot disagree with
  # what the installer actually put on disk.
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pure-Dart image processing for tool/apply_icon.dart, so regenerating app
  # icons needs no ImageMagick or platform tooling.
  image: ^4.2.0
  lints: ^5.0.0

flutter:
  uses-material-design: true
