name: Release

# Flutter desktop builds are host-only — `flutter build linux` refuses to run
# on macOS and vice versa — so each platform is built on its own runner. This
# is the only way to produce all three from one place.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Build a single platform (macOS bills at 10x, so iterate narrowly)'
        type: choice
        default: all
        options: [all, macOS, Linux, Windows]
  push:
    tags: ['v*']

permissions:
  contents: write

# A re-pushed tag or a quick second dispatch should not run two full matrices
# at once. Tag runs are never cancelled — losing half a release matrix to a
# newer run is worse than paying for both.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned deliberately, and kept equal to the version releases are tested
  # against locally. `channel: stable` alone would silently move under us
  # between releases.
  FLUTTER_VERSION: 3.44.6

jobs:
  # Picks which platforms to build.
  #
  # This exists because neither `matrix` nor `secrets` is available in a
  # job-level `if:` — the condition is evaluated before the matrix expands, so
  # filtering there is a workflow parse error rather than a no-op. Emitting the
  # matrix as JSON from a prior job is the way to make it conditional. The job
  # runs on Linux and takes seconds, which is billed at the lowest rate.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          all='[{"os":"macos-latest","name":"macOS","artifact":"*.dmg"},
                {"os":"ubuntu-latest","name":"Linux","artifact":"*.tar.gz"},
                {"os":"windows-latest","name":"Windows","artifact":"*.zip"}]'
          only='${{ inputs.only }}'
          # Empty on a tag push, where every platform is required.
          if [[ -z "$only" || "$only" == "all" ]]; then
            picked=$(jq -c . <<<"$all")
          else
            picked=$(jq -c --arg n "$only" '[.[] | select(.name == $n)]' <<<"$all")
          fi
          echo "building: $picked"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    # This repo is private, so runner minutes are billed — and macOS bills at
    # ten times the Linux rate. A hung codesign prompt or a stuck build should
    # cost twenty minutes, not six hours.
    timeout-minutes: 45
    # Hoisted to the job so the signing steps can test whether a certificate
    # was configured. Neither `secrets` nor a step's own `env:` is in scope in
    # a step-level `if:` — only job-level `env` is — and `secrets` there is a
    # hard workflow parse error, not a silent falsy.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    strategy:
      # Keep going: a Linux packaging failure should not deprive you of the
      # macOS and Windows artifacts.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      # Must run before flutter-action, so the SDK and pub both use it.
      #
      # super_native_extensions builds through cargokit, whose
      # resolve_symlinks.ps1 walks a path one component at a time calling
      # `Get-Item`. `Get-Item` cannot see hidden directories without -Force,
      # and `C:\Users\runneradmin\AppData` is hidden — so resolving Flutter's
      # .plugin_symlinks entry, which points into the pub cache under
      # AppData\Local\Pub\Cache, fails with ItemNotFound and the build hangs
      # rather than failing cleanly.
      #
      # Relocating the cache to a visible root avoids the hidden directory
      # entirely. The short path also buys headroom against MAX_PATH, which
      # cargokit's deep Rust build directories otherwise flirt with.
      - name: Move the pub cache off AppData (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PUB_CACHE=D:\\pubcache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # Required: the build number is `git rev-list --count HEAD`, which
          # returns 1 on the shallow clone Actions makes by default.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # ninja/gtk are Flutter's own desktop requirements; libmpv backs
          # media_kit's audio and video playback.
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev mpv libsecret-1-dev

      # Cheap, and the first thing worth having when a platform that has never
      # been built fails in an unfamiliar way.
      - name: Environment
        shell: bash
        run: |
          echo "host:    $(uname -s) $(uname -m)"
          echo "runner:  $RUNNER_OS $RUNNER_ARCH"
          flutter --version

      - run: flutter pub get
        working-directory: apps/adb_files

      - run: flutter analyze
        working-directory: apps/adb_files

      - run: flutter test
        working-directory: apps/adb_files

      # The app is most of the shipped code but not all of it: these packages
      # go into the binary too, so a release that never ran their tests is
      # shipping untested code.
      - name: Test packages
        shell: bash
        run: |
          for pkg in packages/feature_files packages/feature_stats \
                     packages/feature_logcat; do
            echo "::group::$pkg"
            (cd "$pkg" && flutter test)
            echo "::endgroup::"
          done

      # Signing is optional and only affects macOS.
      #
      # Set MACOS_CERT_P12 (base64 of an exported .p12) and MACOS_CERT_PASSWORD
      # to sign with a real certificate. With no secrets set, the build still
      # signs — ad-hoc — because an unsigned binary will not launch at all on
      # Apple Silicon. Ad-hoc is what makes the app *run*; it is not what makes
      # Gatekeeper trust it.
      #
      # Read the honest version before wiring up secrets: a free Apple ID
      # issues only an "Apple Development" certificate. Signing with it still
      # leaves `spctl -a` rejecting the app on any other machine, so users
      # still need right-click → Open. Only a paid "Developer ID Application"
      # certificate plus notarization removes that step.
      - name: Import signing certificate
        if: matrix.os == 'macos-latest' && env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          # A throwaway keychain, so nothing is left on the runner and the
          # login keychain is never touched.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI prompt that nobody can
          # answer on a headless runner, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it first so release.sh's `security find-identity` sees it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build release
        shell: bash
        working-directory: apps/adb_files
        run: |
          # Plain bash rather than another expression: the certificate either
          # made it into the keychain or it did not, and $MACOS_CERT_P12 is the
          # same signal the import step gated on.
          if [[ "$(uname -s)" == "Darwin" && -n "${MACOS_CERT_P12:-}" ]]; then
            # release.sh prefers Developer ID over Apple Development itself.
            ./tool/release.sh
          else
            # --no-sign does not mean unsigned: Xcode ad-hoc signs during the
            # build (verified — `codesign -dv` reports flags=0x2(adhoc)), which
            # is what lets the app launch on Apple Silicon at all. Skipping
            # release.sh's own codesign pass only skips a signature that would
            # not have satisfied Gatekeeper anyway.
            ./tool/release.sh --no-sign
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: adb_files-${{ matrix.name }}
          path: apps/adb_files/build/release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only tag pushes create a release; a manual run just leaves artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ### Installing

            **macOS** — open the `.dmg` and drag the app to Applications.
            Universal: runs on both Apple Silicon and Intel.
            The build is not notarized, so the first launch needs
            right-click → Open (a double-click is blocked), or:
            `xattr -dr com.apple.quarantine /Applications/adb_files.app`

            **Windows** — unzip and run `adb_files.exe`. SmartScreen will warn
            on first run; choose More info → Run anyway.

            **Linux** — extract and run `./install.sh` (installs to
            `~/.local`, no root needed). Requires `mpv`/`libmpv`.

            All platforms need the Android platform-tools `adb` on PATH, or
            set the path in the app.
